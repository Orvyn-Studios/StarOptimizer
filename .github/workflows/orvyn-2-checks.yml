name: Orvyn 2.0 unit tests

on:
  push:
    branches:
      - feature/orvyn-staroptimizer-2
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'package*.json'
      - '.github/workflows/orvyn-2-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    name: Node unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify pure business logic
        run: npm test
